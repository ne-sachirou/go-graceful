---
name: main branch
"on":
  push:
    branches:
      - main

jobs:
  test-actions:
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: $/.github/workflows/run-test-actions.yaml

  test-go:
    permissions:
      contents: read
    uses: $/.github/workflows/run-test-go.yaml
