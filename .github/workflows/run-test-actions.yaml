---
name: Test GitHub Actions
"on":
  workflow_call:
    inputs:
      github-token:
        required: true
        type: string

jobs:
  test-actions:
    name: Test GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-yamllint@de68272fdca5f2a961fb309e0d2e13c2eb186d9e # v1.23.1
        with:
          fail_level: error
          reporter: github-pr-review
      - uses: ne-sachirou/lint-gha-reviewdog@b2173b3f186f624398947e89fe1e6524787983d5 # v0.0.9
        with:
          github_token: ${{ inputs['github-token'] }}
