---
name: Test GitHub Actions
"on":
  workflow_call:

jobs:
  test-actions:
    name: Test GitHub Actions
    runs-on: ubuntu-26.04
    permissions:
      checks: write
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-yamllint@290d92c84b22627946efc7fd6f038ade2d2beede # v1.25.0
        with:
          fail_level: error
          reporter: github-pr-review
      - uses: ne-sachirou/lint-gha-reviewdog@2e38d654cce110543a3c56846f4690e1b6e27487 # v0.0.14
        with:
          github_token: ${{ github.token }}
